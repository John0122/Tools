# 两个站点共享可重复访问的样例，错误资源保留真实 HTTP 状态。
location = /lab/ws {
    proxy_pass http://target_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $lab_connection;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 10s;
    proxy_buffering off;
}
location /lab/ { include /etc/nginx/proxy-api.conf; }
location ~ ^/fixtures/downloads/(?<download_name>[a-zA-Z0-9._-]+)$ {
    try_files $uri =404;
    add_header Content-Disposition 'attachment; filename="$download_name"' always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}
location /fixtures/ {
    try_files $uri =404;
    # 公开演示资源不使用凭据；允许字体、模块脚本和媒体跨站加载。
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
        video/mp4 mp4;
        audio/mpeg mp3;
        application/vnd.apple.mpegurl m3u8;
        text/plain txt md;
    }
}
