upstream target_backend {
    zone target_backend 32k;
    # 后端容器重建后重新解析 Docker DNS，不需要重启前端。
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

# WebSocket 使用独立 Connection 头；普通 API 继续复用原代理配置。
map $http_upgrade $lab_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    server_tokens off;
    # 端口由 Docker 映射；相对跳转保留浏览器当前的外部端口。
    absolute_redirect off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    location = /api { include /etc/nginx/proxy-api.conf; }
    location /api/ { include /etc/nginx/proxy-api.conf; }
    location = /healthz { include /etc/nginx/proxy-api.conf; }
    include /etc/nginx/lab-locations.conf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
